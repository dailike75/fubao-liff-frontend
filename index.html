<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LIFF Example</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h2>LIFF 用戶資訊</h2>
  <div id="profile"></div>

  <script>
    async function main() {
      await liff.init({ liffId: '2007360279-Er5zaO1B' });

      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        const profile = await liff.getProfile();
        document.getElementById('profile').innerText =
          `Hello, ${profile.displayName}\nYour userId is: ${profile.userId}`;

        // 將資料送到後端
        await fetch('https://fubao-liff-server.onrender.com/api/save-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: profile.userId,
            name: profile.displayName
          })
        });
      }
    }
    main();
  </script>
</body>
</html>
